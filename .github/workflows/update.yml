name: 每日更新頻道影片

on:
  schedule:
    - cron: "0 22 * * *"   # 每天台灣時間早上 6:00
  workflow_dispatch:        # 也可以在 Actions 頁面手動按「Run workflow」
  push:
    paths:
      - "src.html"
      - "data.json"
      - "playlists.json"
      - "assets/**"
      - "scripts/**"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓取新影片並重新產生網頁
        run: |
          python scripts/update.py
          python scripts/build.py
      - name: 有變更就提交
        run: |
          git config user.name "nbstudio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --cached --quiet; then
            echo "沒有變更"
          else
            git commit -m "自動更新影片清單 $(date -u +%Y-%m-%d)"
            git push
          fi
